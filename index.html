<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KemiLab: Simulasi Terpadu Final</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================
           0. GLOBAL & HUB CSS
           ========================================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100vw; height: 100vh; background-color: #1a1a1a; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: 'VT323', monospace, Arial, sans-serif; color: white; touch-action: none; }
        .app-section { position: absolute; width: 100vw; height: 100vh; display: none; justify-content: center; align-items: center; }
        #global-transition { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000; z-index: 9999; pointer-events: none; opacity: 1; transition: opacity 250ms ease; }

        /* Hub Layout */
        #hub-container { position: relative; width: 100%; height: 100%; max-width: calc(100vh * (16/9)); max-height: calc(100vw * (9/16)); aspect-ratio: 16/9; background-color: #000; image-rendering: pixelated; overflow: hidden; }
        .hub-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: 100% 100%; display: none; }
        .btn-hub { position: absolute; background: transparent; border: none; cursor: pointer; z-index: 10; }
        .btn-hub:focus-visible { outline: 2px dashed #fff; outline-offset: -2px; background-color: rgba(255,255,255,0.2); }

        /* ==========================================================
           1. PROJECT 1 CSS: MOLECULES (TERISOLASI)
           ========================================================== */
        #APP_MOL #mol-game-wrapper { position: relative; width: 512px; height: 288px; transform-origin: center center; background-color: #000; }
        #APP_MOL canvas { position: absolute; top: 0; left: 0; width: 512px; height: 288px; image-rendering: pixelated; image-rendering: crisp-edges; }
        #APP_MOL .mol-layer { position: absolute; top: 0; left: 0; width: 512px; height: 288px; pointer-events: none; }
        #APP_MOL .mol-layer-interactive { position: absolute; top: 0; left: 0; width: 512px; height: 288px; }
        #APP_MOL .visual-img { position: absolute; image-rendering: pixelated; background-size: 100% 100%; background-repeat: no-repeat; }
        #APP_MOL #mol-visual-layer .visual-img { top: 0; left: 0; width: 512px; height: 288px; }
        #APP_MOL #mol-popup-layer { display: none; z-index: 100; }
        #APP_MOL #mol-black-screen { position: absolute; top: 0; left: 0; width: 512px; height: 288px; background-color: black; opacity: 1; pointer-events: none; transition: opacity 0.3s ease; z-index: 200; }
        #APP_MOL .ui-text { position: absolute; font-size: 26px; line-height: 32px; text-align: center; pointer-events: none; text-shadow: 2px 2px 0 #000; font-family: 'VT323', monospace; }
        #APP_MOL .fallback-div { display: flex; justify-content: center; align-items: center; font-size: 14px; border: 1px solid #444; text-align: center; background-color: rgba(100, 100, 100, 0.9); }
        #APP_MOL .fade-in { animation: molFadeIn 0.2s forwards; } #APP_MOL .fade-out { animation: molFadeOut 0.2s forwards; } #APP_MOL .pop-in { animation: molPopIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; } #APP_MOL .pop-in-slow { animation: molPopIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes molFadeIn { from { opacity: 0; } to { opacity: 1; } } @keyframes molFadeOut { from { opacity: 1; } to { opacity: 0; } } @keyframes molPopIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* ==========================================================
           2. PROJECT 2 CSS: MOLE BRIDGE (TERISOLASI)
           ========================================================== */
        #APP_MB { font-family: 'VT323', monospace; }
        #APP_MB #game-container { position: relative; width: 100%; height: 100%; max-width: calc(100vh * (16 / 9)); max-height: calc(100vw * (9 / 16)); aspect-ratio: 16 / 9; background-color: #000; image-rendering: pixelated; image-rendering: crisp-edges; container-type: inline-size; overflow: hidden; }
        #APP_MB .scene { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
        #APP_MB .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: 100% 100%; background-position: center; background-repeat: no-repeat; image-rendering: inherit; }
        #APP_MB .btn-grid { position: absolute; background: transparent; border: none; cursor: pointer; z-index: 10; }
        #APP_MB .popup-layer { display: none; z-index: 20; }
        #APP_MB #fade-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; z-index: 99; pointer-events: none; opacity: 0; transition: opacity 250ms ease; }
        #APP_MB .pop-in { animation: popInAnim 200ms cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; transform-origin: center center; }
        @keyframes popInAnim { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        #APP_MB .calc-text { position: absolute; height: 11.11%; width: 25%; display: flex; align-items: center; justify-content: center; text-align: center; color: #000; font-size: 3cqw; }
        #APP_MB #layer-canvas-mol { background-image: url('kanvasmb.png'); z-index: 1; }
        #APP_MB #layer-bottle-mol { z-index: 2; transition: background-image 0.1s; }
        #APP_MB #layer-salt-mol { position: absolute; left: 43.75%; top: 66.66%; width: 12.5%; height: 22.22%; display: flex; justify-content: center; align-items: center; z-index: 3; }
        #APP_MB .salt-pile { background-color: #ffffff; border-radius: 50%; width: 0%; height: 0%; transition: all 0.3s ease; }
        #APP_MB #layer-key-mol { background-image: url('keymb.png'); z-index: 4; pointer-events: none; }
        #APP_MB #layer-nav-mol { background-image: url('mbkey1.png'); z-index: 5; pointer-events: none; }
        #APP_MB #scale-display { position: absolute; left: 43.75%; top: 88.88%; width: 12.5%; height: 11.11%; display: flex; justify-content: center; align-items: center; text-align: center; color: #5b7ea4; font-size: 3.5cqw; z-index: 5; }
        #APP_MB #popup-shelf { background-image: url('mbshelf.png'); }
        #APP_MB #popup-calc-mol { background-image: url('popupmb.png'); }
        #APP_MB #calc-mass-mol { left: 43.75%; top: 33.33%; } #APP_MB #calc-mr-mol { left: 43.75%; top: 44.44%; } #APP_MB #calc-result-mol { left: 43.75%; top: 55.55%; } 
        #APP_MB #layer-canvas-partikel { background-image: url('kanvasmbp.png'); z-index: 1; }
        #APP_MB #layer-lattice-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; cursor: grab; background-repeat: repeat, repeat; }
        #APP_MB #layer-lattice-container:active { cursor: grabbing; }
        #APP_MB #layer-infokey { background-image: url('mbpinfokey.png'); z-index: 3; pointer-events: none; }
        #APP_MB #layer-zat-label { z-index: 4; pointer-events: none; } 
        #APP_MB #layer-nav-partikel { background-image: url('mbkey2.png'); z-index: 4; pointer-events: none; }
        #APP_MB #text-mol-display { position: absolute; left: 81.25%; top: 66.66%; width: 18.75%; height: 11.11%; display: flex; justify-content: center; align-items: center; color: white; font-size: 4cqw; z-index: 5; text-shadow: 2px 2px 0 #000; }
        #APP_MB #popup-calc-partikel { background-image: url('popupmbp.png'); }
        #APP_MB .calc-text-partikel { position: absolute; display: flex; align-items: center; justify-content: center; color: #000; font-size: 3.5cqw; font-weight: normal; }
        #APP_MB #calc-input-mol { left: 37.5%; top: 44.44%; width: 18.75%; height: 11.11%; } #APP_MB #calc-result-partikel { left: 37.5%; top: 55.55%; width: 12.5%; height: 11.11%; }
        #APP_MB #layer-canvas-molar { background-image: url('kanvasmbm.png'); z-index: 1; }
        #APP_MB #layer-aqua { background-image: url('mbaqua11.png'); z-index: 2; }
        #APP_MB #water-stream { position: absolute; left: 45.3%; top: 22.5%; width: 0.6%; height: 0%; background-color: rgba(180, 230, 255, 0.6); z-index: 2; transition: height 0.1s ease; }
        #APP_MB #beaker-fluid-container { position: absolute; left: 37.5%; top: 33.33%; width: 31.25%; height: 55.55%; z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; overflow: hidden; border-bottom-left-radius: 3cqw; border-bottom-right-radius: 3cqw; }
        #APP_MB #layer-liquid { width: 100%; height: 0%; background-color: rgba(180, 230, 255, 0.25); transition: height 0.1s ease, background-color 0.5s ease; }
        #APP_MB #layer-precipitate { width: 100%; height: 0%; background-color: transparent; transition: height 0.4s ease, background-color 0.3s ease; }
        #APP_MB #layer-stir { background-image: url('mbgstir.png'); z-index: 2; display: block; }
        #APP_MB #layer-hand-pour { background-image: url('mbgstir1.png'); z-index: 2; display: none; }
        #APP_MB #layer-glass { background-image: url('mbglass.png'); z-index: 3; pointer-events: none; }
        #APP_MB #layer-key-molar { background-image: url('keymbm.png'); z-index: 4; pointer-events: none; }
        #APP_MB #layer-key-add { background-image: url('keymbm1.png'); z-index: 5; pointer-events: none; display: none; }
        #APP_MB #layer-nav-molar { background-image: url('mbkey3.png'); z-index: 5; pointer-events: none; }
        #APP_MB #volume-display { position: absolute; left: 50%; top: 88.88%; width: 12.5%; height: 11.11%; display: flex; justify-content: center; align-items: center; text-align: center; color: #dcdde1; font-size: 3.5cqw; z-index: 6; }
        #APP_MB #alert-msg { position: absolute; top: 12%; left: 50%; transform: translateX(-50%); color: #e74c3c; font-size: 2.8cqw; font-weight: bold; text-shadow: 2px 2px 0 #000; opacity: 0; transition: opacity 0.3s ease; z-index: 7; pointer-events: none; }
        #APP_MB #popup-molarity { background-image: url('popupmbm.png'); }
        #APP_MB #popup-solubility { background-image: url('mbsolubility.png'); }
        #APP_MB #calc-mol-molar { left: 43.75%; top: 33.33%; } #APP_MB #calc-liter-molar { left: 43.75%; top: 44.44%; } #APP_MB #calc-result-molar { left: 43.75%; top: 55.55%; } 
        #APP_MB #sim-status { position: absolute; left: 31.25%; top: 11.11%; width: 25%; height: 11.11%; display: flex; align-items: center; justify-content: center; color: white; font-size: 4cqw; z-index: 21; text-shadow: 2px 2px 0 #000; }
        #APP_MB .part-sprite { position: absolute; height: 11.11%; width: 6.25%; background-size: contain; background-position: center; background-repeat: no-repeat; z-index: 21; }
        #APP_MB .part-text { position: absolute; height: 11.11%; width: 18.75%; display: flex; align-items: center; justify-content: flex-start; color: white; font-size: 3cqw; z-index: 21; padding-left: 1%; text-shadow: 1px 1px 0 #000; }
        #APP_MB #ui-sprite-1 { left: 12.5%; top: 88.88%; } #APP_MB #ui-text-1 { left: 18.75%; top: 88.88%; }
        #APP_MB #ui-sprite-2 { left: 37.5%; top: 88.88%; } #APP_MB #ui-text-2 { left: 43.75%; top: 88.88%; }
        #APP_MB #ui-text-air { position: absolute; left: 75%; top: 88.88%; width: 12.5%; height: 11.11%; display: flex; align-items: center; justify-content: center; color: white; font-size: 3cqw; z-index: 21; text-shadow: 1px 1px 0 #000; }
        #APP_MB #particle-canvas { position: absolute; left: 12.5%; top: 22.22%; width: 75%; height: 55.55%; z-index: 21; overflow: hidden; }
        #APP_MB .atom-node { position: absolute; background-size: contain; background-position: center; background-repeat: no-repeat; transform-origin: center center; }
        #APP_MB #popup-exit { background-image: url('mbpopupexit.png'); z-index: 30; }

        /* ==========================================================
           3. PROJECT 3 CSS: LIMITING REACTANT (TERISOLASI)
           ========================================================== */
        #APP_LR { font-family: Arial, sans-serif; }
        #APP_LR #lr-game-container { position: relative; width: 512px; height: 288px; transform-origin: center center; image-rendering: pixelated; image-rendering: crisp-edges; }
        #APP_LR .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #APP_LR .full-img { width: 100%; height: 100%; object-fit: contain; display: block; position: absolute; }
        #APP_LR #lr-layer-ui { pointer-events: none; }
        #APP_LR #lr-layer-buttons { z-index: 10; }
        #APP_LR #lr-layer-popup { z-index: 20; display: none; }
        #APP_LR #lr-layer-popup-exit { z-index: 30; display: none; }
        #APP_LR #lr-transition-overlay { z-index: 999; background-color: black; opacity: 1; pointer-events: none; transition: opacity 250ms ease-in-out; }
        #APP_LR .display-text { position: absolute; color: black; font-size: 14px; text-align: center; line-height: 32px; font-weight: bold; }
        #APP_LR .info-container { position: absolute; display: flex; flex-direction: column; }
        #APP_LR .info-row { height: 24px; line-height: 24px; font-size: 12px; color: black; font-weight: bold; text-align: center; }
        #APP_LR .conclusion-text { position: absolute; height: 32px; line-height: 32px; font-size: 14px; font-weight: bold; color: black; text-align: center; }
        #APP_LR .table-cell { position: absolute; height: 32px; line-height: 32px; font-size: 13px; font-weight: bold; color: black; text-align: center; }
        #APP_LR sub { font-size: 0.75em; vertical-align: baseline; position: relative; bottom: -0.25em; }
        #APP_LR .btn { position: absolute; cursor: pointer; }
    </style>
</head>
<body>

    <!-- TRANSISI GLOBAL -->
    <div id="global-transition"></div>

    <!-- ========================================================
         APP SECTION 0: MAIN HUB
         ======================================================== -->
    <div id="APP_HUB" class="app-section" style="display: flex;">
        <div id="hub-container">
            <div id="hub_title" class="hub-screen" style="display: block; background-image: url('titlescreen.png');">
                <button class="btn-hub" style="left: 37.5%; top: 55.55%; width: 25%; height: 22.22%;" onclick="MainHub.goTo('hub_menu')"></button>
                <button class="btn-hub" style="left: 87.5%; top: 88.88%; width: 12.5%; height: 11.11%;" onclick="MainHub.goTo('hub_credits')"></button>
            </div>
            <div id="hub_credits" class="hub-screen" style="background-image: url('credits.png');">
                <button class="btn-hub" style="left: 93.75%; top: 0%; width: 6.25%; height: 11.11%;" onclick="MainHub.goTo('hub_title')"></button>
            </div>
            <div id="hub_menu" class="hub-screen" style="background-image: url('menuscreen.png');">
                <button class="btn-hub" style="left: 93.75%; top: 0%; width: 6.25%; height: 11.11%;" onclick="MainHub.goTo('hub_title')"></button>
                <button class="btn-hub" style="left: 6.25%; top: 55.55%; width: 25%; height: 22.22%;" onclick="MainHub.launchApp('MOL')"></button>
                <button class="btn-hub" style="left: 37.5%; top: 55.55%; width: 25%; height: 22.22%;" onclick="MainHub.launchApp('MB')"></button>
                <button class="btn-hub" style="left: 68.75%; top: 55.55%; width: 25%; height: 22.22%;" onclick="MainHub.launchApp('LR')"></button>
            </div>
        </div>
    </div>

    <!-- ========================================================
         APP SECTION 1: MOLECULES
         ======================================================== -->
    <div id="APP_MOL" class="app-section">
        <div id="mol-game-wrapper">
            <canvas id="mol-game-canvas" width="512" height="288"></canvas>
            <div id="mol-visual-layer" class="mol-layer"></div>
            <div id="mol-visual-btn-layer" class="mol-layer"></div>
            <div id="mol-feedback-layer" class="mol-layer"></div> 
            <div id="mol-hitbox-layer" class="mol-layer-interactive"></div>
            <div id="mol-popup-layer" class="mol-layer-interactive"></div>
            <div id="mol-black-screen"></div>
        </div>
    </div>

    <!-- ========================================================
         APP SECTION 2: MOLE BRIDGE
         ======================================================== -->
    <div id="APP_MB" class="app-section">
        <div id="game-container">
            <div id="fade-overlay"></div>
            <!-- TIMBANGAN -->
            <div id="scene-timbangan" class="scene" style="display: block;">
                <div id="layer-canvas-mol" class="layer"></div>
                <div id="layer-bottle-mol" class="layer"></div>
                <div id="layer-salt-mol"><div id="salt-pile" class="salt-pile"></div></div>
                <div id="layer-key-mol" class="layer"></div>
                <div id="layer-nav-mol" class="layer"></div>
                <div id="scale-display">0,0</div>
                <button class="btn-grid" style="left: 93.75%; top: 0%; width: 6.25%; height: 11.11%;" onclick="MoleBridgeApp.bukaPopupExit()"></button>
                <button class="btn-grid" style="left: 6.25%; top: 22.22%; width: 18.75%; height: 11.11%;" onclick="MoleBridgeApp.bukaRak()"></button>
                <button class="btn-grid" style="left: 6.25%; top: 77.77%; width: 6.25%; height: 11.11%;" onmousedown="MoleBridgeApp.startHoldMassa(event, 5)" onmouseup="MoleBridgeApp.stopHoldMassa()" onmouseleave="MoleBridgeApp.stopHoldMassa()" ontouchstart="MoleBridgeApp.startHoldMassa(event, 5)" ontouchend="MoleBridgeApp.stopHoldMassa()" ontouchcancel="MoleBridgeApp.stopHoldMassa()"></button>
                <button class="btn-grid" style="left: 12.5%; top: 77.77%; width: 6.25%; height: 11.11%;" onmousedown="MoleBridgeApp.startHoldMassa(event, 1)" onmouseup="MoleBridgeApp.stopHoldMassa()" onmouseleave="MoleBridgeApp.stopHoldMassa()" ontouchstart="MoleBridgeApp.startHoldMassa(event, 1)" ontouchend="MoleBridgeApp.stopHoldMassa()" ontouchcancel="MoleBridgeApp.stopHoldMassa()"></button>
                <button class="btn-grid" style="left: 18.75%; top: 77.77%; width: 6.25%; height: 11.11%;" onmousedown="MoleBridgeApp.startHoldMassa(event, 0.5)" onmouseup="MoleBridgeApp.stopHoldMassa()" onmouseleave="MoleBridgeApp.stopHoldMassa()" ontouchstart="MoleBridgeApp.startHoldMassa(event, 0.5)" ontouchend="MoleBridgeApp.stopHoldMassa()" ontouchcancel="MoleBridgeApp.stopHoldMassa()"></button>
                <button class="btn-grid" style="left: 6.25%; top: 88.88%; width: 18.75%; height: 11.11%;" onclick="MoleBridgeApp.resetTimbangan()"></button>
                <button class="btn-grid" style="left: 75%; top: 77.77%; width: 6.25%; height: 11.11%;" onclick="MoleBridgeApp.autoMol(1)"></button>
                <button class="btn-grid" style="left: 81.25%; top: 77.77%; width: 6.25%; height: 11.11%;" onclick="MoleBridgeApp.autoMol(0.5)"></button>
                <button class="btn-grid" style="left: 87.5%; top: 77.77%; width: 6.25%; height: 11.11%;" onclick="MoleBridgeApp.autoMol(0.1)"></button>
                <button class="btn-grid" style="left: 75%; top: 88.88%; width: 18.75%; height: 11.11%;" onclick="MoleBridgeApp.bukaHitungMol()"></button>
                <button class="btn-grid" style="left: 87.5%; top: 11.11%; width: 12.5%; height: 11.11%;" onclick="MoleBridgeApp.gotoScene('scene-partikel')"></button>
                <button class="btn-grid" style="left: 87.5%; top: 22.22%; width: 12.5%; height: 11.11%;" onclick="MoleBridgeApp.gotoScene('scene-molaritas')"></button>

                <div id="popup-shelf" class="layer popup-layer">
                    <button class="btn-grid" style="left: 6.25%; top: 11.11%; width: 12.5%; height: 33.33%; z-index: 21;" onclick="MoleBridgeApp.pilihZat('s')"></button>
                    <button class="btn-grid" style="left: 25%; top: 11.11%; width: 12.5%; height: 33.33%; z-index: 21;" onclick="MoleBridgeApp.pilihZat('nacl')"></button>
                    <button class="btn-grid" style="left: 43.75%; top: 11.11%; width: 12.5%; height: 33.33%; z-index: 21;" onclick="MoleBridgeApp.pilihZat('naoh')"></button>
                    <button class="btn-grid" style="left: 62.5%; top: 11.11%; width: 12.5%; height: 33.33%; z-index: 21;" onclick="MoleBridgeApp.pilihZat('c')"></button>
                    <button class="btn-grid" style="left: 81.25%; top: 11.11%; width: 12.5%; height: 33.33%; z-index: 21;" onclick="MoleBridgeApp.pilihZat('fe')"></button>
                    <button class="btn-grid" style="left: 93.75%; top: 0%; width: 6.25%; height: 11.11%; z-index: 21;" onclick="MoleBridgeApp.tutupRak()"></button>
                </div>
                <div id="popup-calc-mol" class="layer popup-layer">
                    <button class="btn-grid" style="left: 87.5%; top: 22.22%; width: 6.25%; height: 11.11%; z-index: 21;" onclick="MoleBridgeApp.tutupHitungMol()"></button>
                    <div id="calc-mass-mol" class="calc-text">0,0 g</div><div id="calc-mr-mol" class="calc-text">0 g/mol</div><div id="calc-result-mol" class="calc-text">0,0 mol</div>
                </div>
            </div>
            <!-- PARTIKEL -->
            <div id="scene-partikel" class="scene">
                <div id="layer-canvas-partikel" class="layer"></div>
                <div id="layer-lattice-container"></div>
                <div id="layer-infokey" class="layer"></div>
                <div id="layer-zat-label" class="layer"></div>
                <div id="layer-nav-partikel" class="layer"></div>
                <div id="text-mol-display">0 mol</div>
                <button class="btn-grid" style="left: 93.75%; top: 0%; width: 6.25%; height: 11.11%;" onclick="MoleBridgeApp.bukaPopupExit()"></button>
                <button class="btn-grid" style="left: 87.5%; top: 11.11%; width: 12.5%; height: 11.11%;" onclick="MoleBridgeApp.gotoScene('scene-timbangan')"></button>
                <button class="btn-grid" style="left: 87.5%; top: 22.22%; width: 12.5%; height: 11.11%;" onclick="MoleBridgeApp.gotoScene('scene-molaritas')"></button>
                <button class="btn-grid" style="left: 81.25%; top: 77.77%; width: 18.75%; height: 11.11%;" onclick="MoleBridgeApp.bukaHitungPartikel()"></button>
                <div id="popup-calc-partikel" class="layer popup-layer">
                    <button class="btn-grid" style="left: 87.5%; top: 22.22%; width: 6.25%; height: 11.11%; z-index: 21;" onclick="MoleBridgeApp.tutupHitungPartikel()"></button>
                    <div id="calc-input-mol" class="calc-text-partikel">0 mol</div><div id="calc-result-partikel" class="calc-text-partikel">0</div>
                </div>
            </div>
            <!-- MOLARITAS -->
            <div id="scene-molaritas" class="scene">
                <div id="layer-canvas-molar" class="layer"></div>
                <div id="beaker-fluid-container"><div id="layer-liquid"></div><div id="layer-precipitate"></div></div>
                <div id="water-stream"></div>
                <div id="layer-stir" class="layer"></div><div id="layer-hand-pour" class="layer"></div><div id="layer-aqua" class="layer"></div><div id="layer-glass" class="layer"></div>
                <div id="layer-key-molar" class="layer"></div><div id="layer-key-add" class="layer"></div><div id="layer-nav-molar" class="layer"></div>

    <script>
        /* ==========================================================

        const MainHub = (function() {
            let activeApp = 'HUB'; 
            let isTransitioning = false;
            const transitionEl = document.getElementById('global-transition');

            function doFade(callback) {
                if (isTransitioning) return;
                isTransitioning = true;
                transitionEl.style.opacity = '1';
                setTimeout(() => { callback(); setTimeout(() => { transitionEl.style.opacity = '0'; setTimeout(() => { isTransitioning = false; }, 250); }, 50); }, 250);
            }

            function goTo(screenId) {
                doFade(() => { document.querySelectorAll('.hub-screen').forEach(el => el.style.display = 'none'); document.getElementById(screenId).style.display = 'block'; });
            }

            function launchApp(appId) {
                doFade(() => {
                    document.getElementById('APP_HUB').style.display = 'none';
                    activeApp = appId;
                    
                    if (appId === 'MOL') { document.getElementById('APP_MOL').style.display = 'flex'; MoleculesApp.start(); } 
                    else if (appId === 'MB') { document.getElementById('APP_MB').style.display = 'flex'; MoleBridgeApp.start(); }
                    else if (appId === 'LR') { document.getElementById('APP_LR').style.display = 'flex'; LimitingReactantApp.start(); }
                });
            }

            function returnToHub() {
                doFade(() => {
                    document.getElementById('APP_MOL').style.display = 'none';
                    document.getElementById('APP_MB').style.display = 'none';
                    document.getElementById('APP_LR').style.display = 'none';
                    document.getElementById('APP_HUB').style.display = 'flex';
                    activeApp = 'HUB';
                    
                    document.querySelectorAll('.hub-screen').forEach(el => el.style.display = 'none');
                    document.getElementById('hub_menu').style.display = 'block';
                });
            }

            function getActiveApp() { return activeApp; }

            window.onload = () => { setTimeout(() => { transitionEl.style.opacity = '0'; }, 100); };

            window.addEventListener('keydown', (e) => {
                if (isTransitioning) return;
                const key = e.key;

                if (activeApp === 'HUB') {
                    if (key === 'Escape') { e.preventDefault(); if (document.getElementById('hub_menu').style.display === 'block' || document.getElementById('hub_credits').style.display === 'block') goTo('hub_title'); }
                    if (key === 'Enter' || key === ' ') { if (document.getElementById('hub_title').style.display === 'block' && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); goTo('hub_menu'); } }
                }
            });

            return { goTo, launchApp, returnToHub, getActiveApp };
        })();


        /* ==========================================================
           2. LOGIKA PROJECT: MOLECULES
           ========================================================== */
        const MoleculesApp = (function() {
            const wrapper = document.getElementById('mol-game-wrapper'); const canvas = document.getElementById('mol-game-canvas'); const ctx = canvas.getContext('2d'); const visualLayer = document.getElementById('mol-visual-layer'); const visualBtnLayer = document.getElementById('mol-visual-btn-layer'); const feedbackLayer = document.getElementById('mol-feedback-layer'); const popupLayer = document.getElementById('mol-popup-layer'); const blackScreen = document.getElementById('mol-black-screen');
            const TILE_SIZE = 32; const GAME_WIDTH = 512; const GAME_HEIGHT = 288;
            let gameState = 'menu'; let slideIndex = 0; const slideSequence = ['a', 'b', 'c', 'd', 'e', 'f']; let isPopupActive = false; let slideTimer = null; let lastActionTime = 0;
            const quizDatabase = [{ id: 1, name: 'mrqhh.png', x: 'mrans2.png', y: 'mrans1.png', z: 'mrans3.png' },{ id: 2, name: 'mrqchhhh.png', x: 'mrans16.png', y: 'mrans10.png', z: 'mrans13.png' },{ id: 3, name: 'mrqnhhh.png', x: 'mrans17.png', y: 'mrans10.png', z: 'mrans15.png' },{ id: 4, name: 'mrqhho.png', x: 'mrans18.png', y: 'mrans16.png', z: 'mrans17.png' },{ id: 5, name: 'mrqhf.png', x: 'mrans20.png', y: 'mrans10.png', z: 'mrans30.png' },{ id: 6, name: 'mrqnacl.png', x: 'mrans58a.png', y: 'mrans23.png', z: 'mrans35a.png' },{ id: 7, name: 'mrqnaoh.png', x: 'mrans40.png', y: 'mrans30.png', z: 'mrans20.png' },{ id: 8, name: 'mrqhcl.png', x: 'mrans36a.png', y: 'mrans35a.png', z: 'mrans37a.png' },{ id: 9, name: 'mrqoo.png', x: 'mrans32.png', y: 'mrans16.png', z: 'mrans24.png' },{ id: 10, name: 'mrqcoo.png', x: 'mrans44.png', y: 'mrans28.png', z: 'mrans16.png' },{ id: 11, name: 'mrqchhhoh.png', x: 'mrans32.png', y: 'mrans29.png', z: 'mrans34.png' },{ id: 12, name: 'mrqhhs.png', x: 'mrans34.png', y: 'mrans32.png', z: 'mrans17.png' },{ id: 13, name: 'mrqsoo.png', x: 'mrans64.png', y: 'mrans32.png', z: 'mrans48.png' },{ id: 14, name: 'mrqnoo.png', x: 'mrans46.png', y: 'mrans36.png', z: 'mrans30.png' },{ id: 15, name: 'mrqhcn.png', x: 'mrans27.png', y: 'mrans26.png', z: 'mrans28.png' }];
            let currentQuizQuestions = []; let currentQIndex = 0; let score = 0; let correctCount = 0; let wrongCount = 0; let isAnswering = false; let activeSlots = {}; let timerSeconds = 300; let timerInterval = null; let timerElement = null; let popupType = null; 
            const assets = {}; const imageList = ['kanvasmr.png', 'mrmenu.png', 'mrinacla.png', 'mrinaclb.png', 'mrinaclc.png', 'mrinacld.png', 'mrinacle.png', 'mrinaclf.png', 'mrinaclg.png', 'mrkeyilus.png', 'mrkeyilusb.png', 'mrkeyplay.png', 'mrpopupexit.png', 'mrqstart.png', 'mrq1.png', 'mrq12.png', 'mrq123.png', 'mrqquestion.png', 'mrqresult.png', 'mrkeyinfo.png', 'popupinfomr.png', 'mrkeytrue.png', 'mrkeyfalse.png']; quizDatabase.forEach(q => { imageList.push(q.name, q.x, q.y, q.z); });
            function preloadAssets() { imageList.forEach(filename => { const img = new Image(); img.src = filename; img.onload = () => { assets[filename] = img; }; img.onerror = () => { assets[filename] = null; }; }); } preloadAssets(); 
            function resizeGame() { const scale = Math.min(window.innerWidth / GAME_WIDTH, window.innerHeight / GAME_HEIGHT); wrapper.style.transform = `scale(${scale})`; } window.addEventListener('resize', resizeGame); resizeGame();
            function parseTile(tile) { const cols = "abcdefghijklmnop"; return { x: cols.indexOf(tile.charAt(0).toLowerCase()) * TILE_SIZE, y: (parseInt(tile.substring(1)) - 1) * TILE_SIZE }; } function isClickInHitbox(x, y, startTile, endTile) { const start = parseTile(startTile); const end = parseTile(endTile); return (x >= start.x && x <= start.x + (end.x - start.x) + TILE_SIZE && y >= start.y && y <= start.y + (end.y - start.y) + TILE_SIZE); }
            function addVisual(id, filename, container, animClass = 'fade-in', style = '') { const div = document.createElement('div'); div.id = id; div.className = `visual-img ${animClass}`; div.style.cssText = style; if(assets[filename]) { div.style.backgroundImage = `url('${assets[filename].src}')`; } else { div.classList.add('fallback-div'); div.innerHTML = `[${filename}]`; } container.appendChild(div); return div; } function removeVisual(id, animClass = 'fade-out', delay = 200) { const el = document.getElementById(id); if (el) { el.classList.remove('fade-in', 'pop-in', 'pop-in-slow'); el.classList.add(animClass); setTimeout(() => el.remove(), delay); } } function addText(id, text, startTile, endTile, color) { const start = parseTile(startTile); const end = parseTile(endTile); const w = (end.x - start.x) + TILE_SIZE; const div = document.createElement('div'); div.id = id; div.className = 'ui-text fade-in'; div.style.cssText = `left:${start.x}px; top:${start.y}px; width:${w}px; color:${color};`; div.innerText = text; visualBtnLayer.appendChild(div); return div; }
            function initQuizData() { let fixed = quizDatabase.slice(0, 5); let pool = quizDatabase.slice(5).sort(() => Math.random() - 0.5).slice(0, 5); currentQuizQuestions = fixed.concat(pool); currentQIndex = 0; score = 0; correctCount = 0; wrongCount = 0; timerSeconds = 300; } function formatTime(seconds) { const m = Math.floor(seconds / 60).toString().padStart(2, '0'); const s = (seconds % 60).toString().padStart(2, '0'); return `${m}:${s}`; }
            function startTimer() { timerElement = addText('quiz-timer', formatTime(timerSeconds), 'l1', 'n1', '#fff'); timerInterval = setInterval(() => { if (isPopupActive || MainHub.getActiveApp() !== 'MOL') return; if (timerSeconds > 0) { timerSeconds--; timerElement.innerText = formatTime(timerSeconds); } else { clearInterval(timerInterval); setTimeout(() => transitionState('quiz_result', 200), 3000); } }, 1000); }
            function loadQuestion() { visualLayer.innerHTML = ''; visualBtnLayer.innerHTML = ''; feedbackLayer.innerHTML = ''; addVisual('q-base', 'mrqquestion.png', visualLayer); const q = currentQuizQuestions[currentQIndex]; addVisual('q-senyawa', q.name, visualLayer); const boxInfo = parseTile('o1'); addVisual('btn-info', 'mrkeyinfo.png', visualBtnLayer, 'fade-in', `left:${boxInfo.x}px; top:${boxInfo.y}px; width:32px; height:32px;`); timerElement = addText('quiz-timer', formatTime(timerSeconds), 'l1', 'n1', '#fff'); let options = [ { type: 'x', img: q.x }, { type: 'y', img: q.y }, { type: 'z', img: q.z } ].sort(() => Math.random() - 0.5); const slots = [ { id: 'A', tile: 'b7', w: 128 }, { id: 'B', tile: 'g7', w: 128 }, { id: 'C', tile: 'l7', w: 128 } ]; activeSlots = {}; options.forEach((opt, idx) => { const s = slots[idx]; const box = parseTile(s.tile); activeSlots[s.id] = { type: opt.type, tile: s.tile }; addVisual(`ans-${s.id}`, opt.img, visualBtnLayer, 'fade-in', `left:${box.x}px; top:${box.y}px; width:${s.w}px; height:32px;`); }); isAnswering = false; }

            class Partikel { constructor(type, x, y, size, sprite, charge) { this.type = type; this.x = x; this.y = y; this.vx = (Math.random() - 0.5) * 0.8; this.vy = (Math.random() - 0.5) * 0.8; this.size = size; this.charge = charge; this.angle = Math.random() * 360; this.element = document.createElement('div'); this.element.className = 'atom-node'; this.element.style.width = size + 'px'; this.element.style.height = size + 'px'; this.element.style.backgroundImage = `url('${sprite}')`; pCanvas.appendChild(this.element); } update(canvasWidth, canvasHeight) { this.x += this.vx; this.y += this.vy; if (this.x <= 0) { this.x = 0; this.vx *= -1; } if (this.x + this.size >= canvasWidth) { this.x = canvasWidth - this.size; this.vx *= -1; } if (this.y <= 0) { this.y = 0; this.vy *= -1; } if (this.y + this.size >= canvasHeight) { this.y = canvasHeight - this.size; this.vy *= -1; } if (this.type === 'water') { let ionTerdekat = null; let jarakTerdekat = 99999; for (let p of particles) { if (p.type === 'ion1' || p.type === 'ion2') { let dx = (p.x + p.size/2) - (this.x + this.size/2); let dy = (p.y + p.size/2) - (this.y + this.size/2); let dist = Math.sqrt(dx*dx + dy*dy); if (dist < 120 && dist < jarakTerdekat) { jarakTerdekat = dist; ionTerdekat = p; } } } if (ionTerdekat) { let targetRad = Math.atan2((ionTerdekat.y + ionTerdekat.size/2) - (this.y + this.size/2), (ionTerdekat.x + ionTerdekat.size/2) - (this.x + this.size/2)); let targetDeg = targetRad * (180 / Math.PI); if (ionTerdekat.charge === 1) this.angle = targetDeg + 90; else if (ionTerdekat.charge === -1) this.angle = targetDeg - 90; if (jarakTerdekat > 40) { this.vx += Math.cos(targetRad) * 0.03; this.vy += Math.sin(targetRad) * 0.03; } this.vx *= 0.98; this.vy *= 0.98; } else { this.angle += 0.5; } } this.element.style.left = this.x + 'px'; this.element.style.top = this.y + 'px'; this.element.style.transform = `rotate(${this.angle}deg)`; } }
            function mulaiEnginePartikel() { pCanvas.innerHTML = ''; particles = []; let cWidth = pCanvas.clientWidth; let cHeight = pCanvas.clientHeight; let isLarut = larutanTelahDiaduk && zatAktif.larut; let globalMol = getGlobalMol(); let volLiters = volumeAir_mL / 1000; let molaritas = isLarut ? (globalMol / volLiters) : 0; let baseWaterCount = 45; let ionPairs = isLarut ? Math.min(Math.round(molaritas * 5), 25) : 0; for (let i = 0; i < baseWaterCount; i++) particles.push(new Partikel('water', Math.random() * (cWidth - 30), Math.random() * (cHeight - 30), 30, 'mbparthoh.png', 0)); if (isLarut && ionPairs > 0) { for (let i = 0; i < ionPairs; i++) { particles.push(new Partikel('ion1', Math.random() * cWidth, Math.random() * cHeight, 30, zatAktif.ion1.sprite, zatAktif.ion1.charge)); if(zatAktif.ion2) particles.push(new Partikel('ion2', Math.random() * cWidth, Math.random() * cHeight, 30, zatAktif.ion2.sprite, zatAktif.ion2.charge)); } } else if (!larutanTelahDiaduk && zatTelahDituang) { let startX = cWidth / 2 - 60; let startY = cHeight - 90; let rows = 3; let cols = 4; let spacing = 28; for (let r = 0; r < rows; r++) { for (let c = 0; c < cols; c++) { let px = startX + (c * spacing); let py = startY + (r * spacing); if (zatAktif.ion2) { let sprite = (r + c) % 2 === 0 ? zatAktif.ion1.sprite : zatAktif.ion2.sprite; let p = new Partikel('solid', px, py, 30, sprite, 0); p.vx = 0; p.vy = 0; particles.push(p); } else { let p = new Partikel('solid', px, py, 30, zatAktif.ion1.sprite, 0); p.vx = 0; p.vy = 0; particles.push(p); } } } } loopPartikel(); }
            function loopPartikel() { let cWidth = pCanvas.clientWidth; let cHeight = pCanvas.clientHeight; for (let i = 0; i < particles.length; i++) { for (let j = i + 1; j < particles.length; j++) { let p1 = particles[i]; let p2 = particles[j]; if (p1.type === 'solid' && p2.type === 'solid') continue; let dx = (p1.x + p1.size/2) - (p2.x + p2.size/2); let dy = (p1.y + p1.size/2) - (p2.y + p2.size/2); let dist = Math.sqrt(dx*dx + dy*dy); let minDist = (p1.size + p2.size) / 2; if (dist < minDist && dist > 0) { let overlap = minDist - dist; let nx = dx / dist; let ny = dy / dist; if (p1.type !== 'solid') { p1.x += nx * (overlap / 2); p1.y += ny * (overlap / 2); } if (p2.type !== 'solid') { p2.x -= nx * (overlap / 2); p2.y -= ny * (overlap / 2); } let tempVx = p1.vx; let tempVy = p1.vy; p1.vx = p2.vx; p1.vy = p2.vy; p2.vx = tempVx; p2.vy = tempVy; } } } for (let p of particles) { p.update(cWidth, cHeight); } animFrameId = requestAnimationFrame(loopPartikel); }

            window.addEventListener('keydown', (e) => {

            });

            return { start, gotoScene, bukaRak, tutupRak, pilihZat, startHoldMassa, stopHoldMassa, resetTimbangan, autoMol, bukaHitungMol, tutupHitungMol, bukaHitungPartikel, tutupHitungPartikel, mulaiTuangAir, hentiTuangAir, eksekusiTambahZat, resetSimulasiMolar, bukaSolubility, tutupSolubility, bukaMolaritas, tutupMolaritas, bukaPopupExit, konfirmasiExit };
        })();


        /* ==========================================================

        const LimitingReactantApp = (function() {
            function resizeScreen() { const container = document.getElementById('lr-game-container'); const scale = Math.min(window.innerWidth / 512, window.innerHeight / 288); container.style.transform = `scale(${scale})`; }
            window.addEventListener('resize', () => { if(MainHub.getActiveApp() === 'LR') resizeScreen(); });

            const reactionData = {
                "rx1": { prefix: "lrnacl", layout: 3, reactA: { name: "Na", ar: 23, coeff: 2, type: "solid" }, reactB: { name: "Cl<sub>2</sub>", ar: 71, coeff: 1, type: "gas" }, productA: { name: "NaCl", ar: 58.5, coeff: 2, type: "solid" } },
                "rx2": { prefix: "lrhho", layout: 3, reactA: { name: "H<sub>2</sub>", ar: 2, coeff: 2, type: "gas" }, reactB: { name: "O<sub>2</sub>", ar: 32, coeff: 1, type: "gas" }, productA: { name: "H<sub>2</sub>O", ar: 18, coeff: 2, type: "liquid" } },
                "rx3": { prefix: "lrnhhh", layout: 3, reactA: { name: "N<sub>2</sub>", ar: 28, coeff: 1, type: "gas" }, reactB: { name: "H<sub>2</sub>", ar: 2, coeff: 3, type: "gas" }, productA: { name: "NH<sub>3</sub>", ar: 17, coeff: 2, type: "gas" } },
                "rx4": { prefix: "lrcoo", layout: 4, reactA: { name: "CH<sub>4</sub>", ar: 16, coeff: 1, type: "gas" }, reactB: { name: "O<sub>2</sub>", ar: 32, coeff: 2, type: "gas" }, productA: { name: "CO<sub>2</sub>", ar: 44, coeff: 1, type: "gas" }, productB: { name: "H<sub>2</sub>O", ar: 18, coeff: 2, type: "liquid" } }
            };

            let activeReaction = "rx1"; let currentStage = 1; let mode = 'mol'; let inventory = { reactantA: 0, reactantB: 0 };
            const config = { mol: { max: 10, step: 0.1, unit: 'mol', holdSpeed: 100 }, mass: { max: 100, step: 0.05, unit: 'g', holdSpeed: 50 } };

                'kanvaslr.png', 'kanvaslrr.png', 'kanvaslrt.png', 'lrshelf.png', 'lrpopupexit.png',

            let isInitialized = false; let loaded = 0;

            const overlay = document.getElementById('lr-transition-overlay');
            function doTransition(fadeType, msIn, msOut, midCallback) {

                setTimeout(() => { midCallback(); overlay.style.transition = `opacity ${msOut}ms ease-in-out`; overlay.style.opacity = '0'; }, msIn);
            }

            function formatNumberFixed(num) { return Number(num).toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
            function formatNumberMax(num) { return Number(num).toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }

            function updateDisplay() { let unit = config[mode].unit; document.getElementById('lr-disp-react-a').innerHTML = `${formatNumberFixed(inventory.reactantA)} ${unit}`; document.getElementById('lr-disp-react-b').innerHTML = `${formatNumberFixed(inventory.reactantB)} ${unit}`; }
            function modifyInventory(target, isAdd) { let max = config[mode].max; inventory[target] += isAdd ? config[mode].step : -config[mode].step; inventory[target] = Math.max(0, Math.min(max, inventory[target])); inventory[target] = Math.round(inventory[target] * 100) / 100; updateDisplay(); }

            function setupHold(id, target, isAdd) {
                const btn = document.getElementById(id); let holdTimeout, holdInterval;
                const startHold = (e) => { if (e) e.preventDefault(); modifyInventory(target, isAdd); holdTimeout = setTimeout(() => { holdInterval = setInterval(() => modifyInventory(target, isAdd), config[mode].holdSpeed); }, 1000); };
                const stopHold = (e) => { if (e) e.preventDefault(); clearTimeout(holdTimeout); clearInterval(holdInterval); };
                btn.addEventListener('mousedown', startHold); btn.addEventListener('touchstart', startHold);
                ['mouseup', 'mouseleave', 'touchend'].forEach(evt => btn.addEventListener(evt, stopHold));
            }

            function switchReaction(rxId) {
                const pop = document.getElementById('lr-layer-popup');
                doTransition('black', 200, 200, () => {
                    activeReaction = rxId; inventory = { reactantA: 0, reactantB: 0 }; mode = 'mol';
                    document.getElementById('lr-bg-img').src = 'kanvaslr.png'; document.getElementById('lr-vis-reactant').src = `${reactionData[activeReaction].prefix}1.png`; document.getElementById('lr-vis-statbar').src = 'statbarlr.png'; pop.style.display = 'none'; updateDisplay();
                });
            }

            function goToStage1() {
                doTransition('black', 300, 300, () => {
                    currentStage = 1; document.getElementById('lr-bg-img').src = 'kanvaslr.png'; document.getElementById('lr-vis-reactant').src = `${reactionData[activeReaction].prefix}1.png`;
                    document.getElementById('lr-vis-keybar-s1').style.display = 'block'; document.getElementById('lr-vis-keybar-s3-a').style.display = 'none'; document.getElementById('lr-vis-keybar-s3-b').style.display = 'none';
                    document.getElementById('lr-vis-statbar').src = (mode === 'mol') ? 'statbarlr.png' : 'statbarlrm.png'; document.getElementById('lr-vis-statbar').style.display = 'block';
                    document.getElementById('lr-layer-visual').style.display = 'block'; document.getElementById('lr-layer-ui').style.display = 'block'; document.getElementById('lr-btn-close').style.display = 'block';
                    document.getElementById('lr-stage1-ui').style.display = 'block'; document.getElementById('lr-stage2-ui').style.display = 'none'; document.getElementById('lr-stage3-ui').style.display = 'none';
                    document.getElementById('lr-stage1-buttons').style.display = 'block'; document.getElementById('lr-stage2-buttons').style.display = 'none'; document.getElementById('lr-stage3-buttons').style.display = 'none'; updateDisplay();
                });
            }

            function goToStage2() {
                doTransition('black', 250, 250, () => {
                    currentStage = 2; document.getElementById('lr-bg-img').src = 'kanvaslrr.png'; document.getElementById('lr-vis-reactant').src = `${reactionData[activeReaction].prefix}2.png`;
                    document.getElementById('lr-vis-keybar-s1').style.display = 'none'; document.getElementById('lr-vis-statbar').src = 'statbarlrr.png';
                    document.getElementById('lr-stage1-ui').style.display = 'none'; document.getElementById('lr-stage2-ui').style.display = 'block';
                    document.getElementById('lr-stage1-buttons').style.display = 'none'; document.getElementById('lr-stage2-buttons').style.display = 'block'; calculateLimitingReactant();
                });
            }

            function goToStage3() {
                doTransition('black', 250, 250, () => {
                    currentStage = 3; document.getElementById('lr-bg-img').src = 'kanvaslrt.png'; document.getElementById('lr-vis-reactant').src = `${reactionData[activeReaction].prefix}3.png`; document.getElementById('lr-vis-statbar').src = 'statbarlrt.png';
                    document.getElementById('lr-stage2-ui').style.display = 'none'; document.getElementById('lr-stage3-ui').style.display = 'block';

            function closeExitPopup() { document.getElementById('lr-layer-popup-exit').style.display = 'none'; }

            function getCurrentMoles() {
                const rData = reactionData[activeReaction]; let molA, molB;
                if(mode === 'mol') { molA = inventory.reactantA; molB = inventory.reactantB; } else { molA = inventory.reactantA / rData.reactA.ar; molB = inventory.reactantB / rData.reactB.ar; }
                return { molA, molB, rData };
            }

            function calculateLimitingReactant() {
                const { molA, molB, rData } = getCurrentMoles(); let massA = molA * rData.reactA.ar; let massB = molB * rData.reactB.ar; let ratioA = molA / rData.reactA.coeff; let ratioB = molB / rData.reactB.coeff;
                document.getElementById('lr-stg2-mass-a').innerHTML = `massa: ${formatNumberFixed(massA)} g`; document.getElementById('lr-stg2-mol-a').innerHTML = `mol: ${formatNumberFixed(molA)} mol`; document.getElementById('lr-stg2-coef-a').innerHTML = `koef: ${rData.reactA.coeff}`; document.getElementById('lr-stg2-ratio-a').innerHTML = `rasio: ${formatNumberMax(ratioA)}`;
                document.getElementById('lr-stg2-mass-b').innerHTML = `massa: ${formatNumberFixed(massB)} g`; document.getElementById('lr-stg2-mol-b').innerHTML = `mol: ${formatNumberFixed(molB)} mol`; document.getElementById('lr-stg2-coef-b').innerHTML = `koef: ${rData.reactB.coeff}`; document.getElementById('lr-stg2-ratio-b').innerHTML = `rasio: ${formatNumberMax(ratioB)}`;
                const nameA = rData.reactA.name; const nameB = rData.reactB.name;
                let conclusion = (ratioA < ratioB) ? `Karena ${nameA} &lt; ${nameB}, maka ${nameA} adalah pereaksi pembatas` : (ratioB < ratioA) ? `Karena ${nameA} &gt; ${nameB}, maka ${nameB} adalah pereaksi pembatas` : `Karena ${nameA} = ${nameB}, tidak ada pereaksi pembatas`;

            function calculateMRSTable() {
                const { molA, molB, rData } = getCurrentMoles(); let ratioA = molA / rData.reactA.coeff; let ratioB = molB / rData.reactB.coeff; let limitingRatio = Math.min(ratioA, ratioB);
                let rxA = limitingRatio * rData.reactA.coeff; let rxB = limitingRatio * rData.reactB.coeff; let rxP1 = limitingRatio * rData.productA.coeff; let sisaA = molA - rxA; let sisaB = molB - rxB;
                const imgA = document.getElementById('lr-vis-keybar-s3-a'); const imgB = document.getElementById('lr-vis-keybar-s3-b'); imgA.style.display = 'block'; imgB.style.display = 'block';

                    document.getElementById('lr-l4-rx-a').innerHTML = `${formatNumberFixed(rxA)} mol`; document.getElementById('lr-l4-rx-b').innerHTML = `${formatNumberFixed(rxB)} mol`; document.getElementById('lr-l4-rx-p1').innerHTML = `${formatNumberFixed(rxP1)} mol`; document.getElementById('lr-l4-rx-p2').innerHTML = `${formatNumberFixed(rxP2)} mol`;
                    document.getElementById('lr-l4-sisa-a').innerHTML = Math.abs(sisaA) < 0.001 ? `-` : `${formatNumberFixed(sisaA)} mol`; document.getElementById('lr-l4-sisa-b').innerHTML = Math.abs(sisaB) < 0.001 ? `-` : `${formatNumberFixed(sisaB)} mol`; document.getElementById('lr-l4-sisa-p1').innerHTML = Math.abs(rxP1) < 0.001 ? `-` : `${formatNumberFixed(rxP1)} mol`; document.getElementById('lr-l4-sisa-p2').innerHTML = Math.abs(rxP2) < 0.001 ? `-` : `${formatNumberFixed(rxP2)} mol`;
                }
            }

                document.getElementById('lr-pop-rx1').addEventListener('click', () => switchReaction('rx1')); document.getElementById('lr-pop-rx2').addEventListener('click', () => switchReaction('rx2')); document.getElementById('lr-pop-rx3').addEventListener('click', () => switchReaction('rx3')); document.getElementById('lr-pop-rx4').addEventListener('click', () => switchReaction('rx4'));

                document.addEventListener('keydown', (e) => {
                    if (MainHub.getActiveApp() !== 'LR') return;
                    const isShelfOpen = popShelf.style.display === 'block'; const popExit = document.getElementById('lr-layer-popup-exit'); const isExitOpen = popExit.style.display === 'block';
                    if (isExitOpen) { if (e.key === 'Escape') { closeExitPopup(); } else if (e.key === 'Enter' || e.key === ' ') { popExit.style.display = 'none'; MainHub.returnToHub(); } } 
                    else if (isShelfOpen) { if (e.key === 'Escape') { doTransition('black', 200, 200, () => popShelf.style.display = 'none'); } } 
                    else { if (e.key === 'Escape') { openExitPopup(); } }
                });
            }

            function start() {
                resizeScreen();

                inventory = { reactantA: 0, reactantB: 0 }; mode = 'mol';
                document.getElementById('lr-layer-popup').style.display = 'none'; document.getElementById('lr-layer-popup-exit').style.display = 'none';
                goToStage1();
            }
            return { start };
        })();
